[package]
name = "presenter-cursor"
version = "1.1.0"
description = "PresenterCursor desktop presentation helper"
authors = ["PresenterCursor"]
edition = "2021"

[lib]
name = "presenter_cursor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = "s"
strip = true
